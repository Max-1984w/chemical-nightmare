let SEEN={};try{SEEN=JSON.parse(localStorage.getItem('cn_seen'))||{}}catch(e){}
function pickQ(){
  let p=Q[S.lv],s=SEEN[S.lv]||[],av=p.map((_,i)=>i).filter(i=>!s.includes(i));
  if(!av.length){s=[];av=p.map((_,i)=>i)}
  let i=av[Math.floor(Math.random()*av.length)];
  s.push(i);SEEN[S.lv]=s;
  try{localStorage.setItem('cn_seen',JSON.stringify(SEEN))}catch(e){}
  return p[i]
}

const CH=[
  {n:'Leo',d:'Estudante comum.',ha:'#5a3320',sh:'#e8e8e8',pa:'#2f4c8a',sp:0},
  {n:'Mia',d:'Estudante comum.',ha:'#c0392b',sh:'#e07fb0',pa:'#4a3a6a',sp:0},
  {n:'Dr. Quím ★',d:'ESPECIAL: sem debuffs e imune às armadilhas.',ha:'#ddd',sh:'#fff',pa:'#3a3a48',sp:1,gl:'#4ff'},
  {n:'Nox ★',d:'ESPECIAL: sem debuffs e imune às armadilhas.',ha:'#222',sh:'#2a2a3a',pa:'#111',sp:1,gl:'#8f4'}
];

const PTS=10;let SC=Array(10).fill(0);try{SC=JSON.parse(localStorage.getItem('cn_sc'))||SC}catch(e){}
const tot=()=>SC.reduce((a,b)=>a+b,0);function win(){SC[S.lv]=PTS;try{localStorage.setItem('cn_sc',JSON.stringify(SC))}catch(e){}end(true)}
const DN=['','Lentidão','Controles invertidos','Visão prejudicada','Desorientação'];
const S={jy:0,jv:0,st:'menu',lv:0,ch:0,u:0,v:0,ku:-60,kv:0,mode:0,tr:[],t:0,un:1,fl:0,hb:0,deb:0,dt:0,slow:0,stun:0,hp:3,L:900,src:''};
try{S.un=+localStorage.getItem('cn_un')||1}catch(e){}

const D={l:0,r:0,u:0,d:0},J={x:0,y:0};let jp=null;const jz=$('jz'),jb=$('jb'),jk=$('jk');
function jset(dx,dy){let m=Math.hypot(dx,dy),rr=40;if(m>rr){dx*=rr/m;dy*=rr/m}jk.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;let nx=dx/rr,ny=dy/rr;J.x=Math.abs(nx)<.15?0:nx;J.y=Math.abs(ny)<.15?0:ny}
jz.onpointerdown=e=>{e.preventDefault();aud();jp={id:e.pointerId,x:e.clientX,y:e.clientY};let r=jz.getBoundingClientRect();jb.style.left=(e.clientX-r.left)+'px';jb.style.top=(e.clientY-r.top)+'px';jb.style.opacity=1;try{jz.setPointerCapture(e.pointerId)}catch(x){}jset(0,0)};
jz.onpointermove=e=>{if(jp&&e.pointerId==jp.id)jset(e.clientX-jp.x,e.clientY-jp.y)};
const jend=e=>{if(jp&&e.pointerId==jp.id){jp=null;jset(0,0);jb.style.left='70px';jb.style.top='calc(100% - 70px)';jb.style.opacity=.5}};jz.onpointerup=jend;jz.onpointercancel=jend;$('jpb').onpointerdown=e=>{e.preventDefault();aud();jump()};function jump(){if(S.st=='play'&&S.jy<=0&&S.jv==0)S.jv=170}
addEventListener('keydown',e=>{if(e.key==' ')jump();let k={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'}[e.key];if(k)D[k]=1;aud()});
addEventListener('keyup',e=>{let k={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'}[e.key];if(k)D[k]=0});
document.querySelectorAll('#dp button').forEach(b=>{let k=b.dataset.d;b.onpointerdown=e=>{e.preventDefault();D[k]=1;aud()};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>D[k]=0))});

// Áudio
let AC,dr,dg;
function aud(){try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();dr=AC.createOscillator();dr.type='sawtooth';dr.frequency.value=48;let f=AC.createBiquadFilter();f.frequency.value=200;dg=AC.createGain();dg.gain.value=.03;dr.connect(f);f.connect(dg);dg.connect(AC.destination);dr.start()}catch(e){AC=0}}
function amb(d){if(!AC)return;dg.gain.setTargetAtTime(.03+d*.12,AC.currentTime,.1);dr.frequency.setTargetAtTime(48+d*36,AC.currentTime,.2)}
function tone(f1,f2,dur,type,g){if(!AC)return;let o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(AC.destination);o.start();o.stop(t+dur)}
function scareSnd(){if(!AC)return;tone(1400,120,1.1,'sawtooth',.4);tone(90,40,1.2,'square',.4);let b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);let s=AC.createBufferSource(),g=AC.createGain();g.gain.value=.5;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start()}

// UI
function scr(id){document.querySelectorAll('.o').forEach(e=>e.classList.toggle('on',e.id==id))}
function setSt(s){S.st=s;$('jz').style.display=$('jpb').style.display=s=='play'?'block':'none';if(s!='play'){J.x=J.y=0}$('pb').style.display=s=='play'?'block':'none'}
function mkLS(){let g=$('lg');g.innerHTML='';LV.forEach((l,i)=>{let b=document.createElement('button');b.textContent=i+1;b.disabled=i>=S.un;b.onclick=()=>start(i);b.onpointerenter=()=>$('li').textContent=l[0]+' — '+l[1];g.append(b)});$('li').innerHTML='Personagem: <b>'+CH[S.ch].n+'</b> · Pontos: <b>'+tot()+'/'+PTS*10+'</b>'}
function mkCS(){let g=$('cg');g.innerHTML='';CH.forEach((c,i)=>{let b=document.createElement('button');b.innerHTML='<b>'+c.n+'</b><br><small>'+c.d+'</small>';if(i==S.ch)b.style.background='#5a1a12';b.onclick=()=>{S.ch=i;mkCS()};g.append(b)})}
function menu(){setSt('menu');S.tr=[];scr('m')}
function pause(){if(S.st=='play'){setSt('pause');scr('ps')}}
function resume(){scr(null);setSt('play')}

function start(l){
  Object.assign(S,{lv:l,L:2400+l*70,jy:0,jv:0,ks:62,kb:0,pf:1,ac:4,tg:0,kd:0,hf:0,u:0,v:0,ku:-80,kv:0,hp:3,mode:0,deb:0,dt:0,slow:0,stun:0,lt:5,fl:0,t:0,hb:0,n:0,src:''});
  S.tr=[];S.z=[];
  let k=3;for(let i=0;i<k;i++){let a=300+i*(S.L-700)/k+hs(i+l*5)*60;S.z.push([a,a+220])}
  let n=Math.floor(S.L/100);
  for(let i=0;i<n;i++){
    let ty=T[l].split('|')[0];
    S.tr.push({u:170+(i+hs(i*11+l)*.9)*(S.L-300)/n,v:(hs(i*3+l)-.5)*50,h:-999,o:hs(i+5)*2.2,k:ty[Math.floor(hs(i*7+l)*ty.length)]})
  }
  aud();scr(null);setSt('play')
}

// Função de Fim de Jogo (Restaurada para evitar ReferenceError)
function end(w){
  setSt('end');amb(0);let L=LV[S.lv];
  $('et').textContent=w?'VOCÊ ESCAPOU!':'FIM DE JOGO';
  $('ed').textContent=w?(S.lv==9?'Você derrotou todos os assassinos! Total: '+tot()+'/'+PTS*10+' pontos.':'Fase '+(S.lv+1)+' concluída — '+L[1]+' ficou para trás. +'+PTS+' pontos (total '+tot()+'/'+PTS*10+').'):(S.src=='chest'?'O baú explodiu na fase '+(S.lv+1)+'. Revise a matéria!':L[1]+' te pegou na fase '+(S.lv+1)+'. Revise a matéria!');
  let b=$('e1');
  if(w&&S.lv<9){b.textContent='Próxima fase';b.onclick=()=>start(S.lv+1);if(S.un<S.lv+2){S.un=S.lv+2;try{localStorage.setItem('cn_un',S.un)}catch(e){}}}
  else{b.textContent=w?'Jogar de novo':'Tentar de novo';b.onclick=()=>start(w?0:S.lv)}
  scr('en')
}

// QTE (Perguntas)
function qte(){
  setSt('qte');
  let a=pickQ().split('|'),ans=a[1];
  $('qt').textContent=a[0];
  $('qo').innerHTML='';
  $('qf').innerHTML='&nbsp;';
  a.slice(1).sort(()=>Math.random()-.5).forEach(t=>{
    let b=document.createElement('button');
    b.textContent=t;b.dataset.ok=t==ans?1:0;
    b.onclick=()=>answer(b,t==ans);
    $('qo').append(b)
  });
  S.qt=10;S.ql=0;scr('q')
}

function answer(b,ok){
  if(S.ql)return;S.ql=1;
  document.querySelectorAll('#qo button').forEach(x=>{if(x.dataset.ok==1)x.style.background='#1f7a3a'});
  if(b&&!ok)b.style.background='#8a1f1f';
  $('qf').textContent=ok?'✔ Correto! Você escapou!':(b?'✘ Errado!':'⏱ Tempo esgotado!');
  tone(ok?500:120,ok?900:60,.3,'square',.15);
  setTimeout(()=>{
